<dialog id="nml-modal" class="nml-modal">
  <form method="dialog" class="nml-modal__header">
    <h3>Namelist values — {{ cfg.label }} <small>on {{ snapshot.label }}</small></h3>
    <button class="nml-close" value="close" aria-label="Close">&times;</button>
  </form>
  <div class="nml-modal__body">
    <table class="nml-table">
      <thead><tr><th>Variable</th><th>Group</th><th>Value</th><th>Source</th></tr></thead>
      <tbody>
        {% for r in rows %}
        <tr>
          <td>{% if r.module %}<span class="muted">{{ r.module }}::</span>{% endif %}{{ r.name }} <button type="button" class="add-btn" data-add-var="{{ r.module }}::{{ r.name }}" data-label="{{ r.name }}">add</button></td>
          <td class="muted">{{ r.group }}</td>
          <td><code>{{ r.value }}</code></td>
          <td><span class="badge badge-{{ r.source|slice:':6' }}">{{ r.source }}</span></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</dialog>
<script>(function(){var d=document.getElementById('nml-modal'); if(d&&d.showModal){d.showModal(); d.addEventListener('close',function(){d.remove();});}})();</script>
