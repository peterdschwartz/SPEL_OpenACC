<tr id="row-{{ ig.var_name }}" class="{% if overridden %}overridden{% endif %}">
  <td class="muted">{{ ig.namelist_group }}</td>
  <td><strong>{{ ig.var_name }}</strong><br><span class="muted">{{ ig.gv_module.module_name }}</span></td>
  <td><code>{{ ig.var_type }}</code></td>
  <td><code>{{ ig.value }}</code></td>
  <td>
    <form hx-post="{% url 'set_config_value' config.id ig.var_name %}" hx-target="#row-{{ ig.var_name }}" hx-swap="outerHTML" class="inline-form">
      <input type="text" name="value" value="{{ current }}">
      <button type="submit" class="styled-button">Save</button>
    </form>
  </td>
  <td>
    {% if overridden %}
    <form hx-post="{% url 'set_config_value' config.id ig.var_name %}" hx-target="#row-{{ ig.var_name }}" hx-swap="outerHTML" class="inline-form">
      <input type="hidden" name="reset" value="1"><button type="submit" class="link-button">Reset</button>
    </form>
    {% endif %}
  </td>
</tr>
