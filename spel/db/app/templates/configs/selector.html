<div id="config-picker" class="picker">
  <label for="config-select" class="picker-label">Config:</label>
  <select id="config-select" name="config" hx-post="{% url 'select_config_htmx' %}" hx-target="#config-picker" hx-swap="outerHTML" hx-trigger="change">
    <optgroup label="Presets">
      {% for c in configs %}{% if c.kind == "preset" %}
      <option value="{{ c.key }}" {% if c.key == cfg.key %}selected{% endif %}>{{ c.label }}</option>
      {% endif %}{% endfor %}
    </optgroup>
    {% if request.user.is_authenticated %}
    <optgroup label="My configs">
      {% for c in configs %}{% if c.kind == "user" %}
      <option value="{{ c.key }}" {% if c.key == cfg.key %}selected{% endif %}>{{ c.label }}</option>
      {% endif %}{% endfor %}
    </optgroup>
    {% endif %}
  </select>
</div>
