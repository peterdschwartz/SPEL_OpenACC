{% if items %}
<div class="dropdown" role="listbox" aria-label="Variable matches">
  {% for item in items %}
  {% if item.kind == "instance" %}
  <a href="{% url 'type_detail' item.type %}?instance={{ item.key }}" role="option" data-pick-instance="{{ item.key }}">{{ item.label }} <small class="muted">{{ item.detail }} · components</small></a>
  {% else %}
  <a href="#" role="option" data-add-var="{{ item.key }}" data-label="{{ item.label }}">{{ item.label }} <small class="muted">{{ item.detail }} · add to trace list</small></a>
  {% endif %}
  {% endfor %}
</div>
{% elif query %}
<div class="dropdown" role="listbox"><div class="empty">No matches for “{{ query }}”.</div></div>
{% endif %}
