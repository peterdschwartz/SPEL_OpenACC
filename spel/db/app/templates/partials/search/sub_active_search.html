{% if results %}
<div class="dropdown" role="listbox" aria-label="Routine matches">
  {% for r in results %}
  <a href="{% url 'sub_view' r.sub_id %}" role="option" class="{% if not r.analyzed %}muted{% endif %}">
    <span class="muted">{{ r.module.module_name|default:'lib' }}::</span>{{ r.subroutine_name }}{% if not r.analyzed %} <small>(not in the step)</small>{% endif %}
  </a>
  {% endfor %}
</div>
{% elif query %}
<div class="dropdown" role="listbox"><div class="empty">No matches for “{{ query }}”.</div></div>
{% endif %}
