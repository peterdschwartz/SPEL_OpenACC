<form class="search-form" hx-boost="false" onsubmit="return false;">
  <input id="var-search-input{% if mode == 'add' %}-add{% endif %}" class="form-control" type="search" name="search" autocomplete="off"
    placeholder="Add a variable to the trace list…"
    hx-post="{% url 'var_active_search' %}" hx-vals='{"mode": "{{ mode|default:'go' }}"}'
    hx-trigger="input changed delay:250ms, focus" hx-target="next .search-results" hx-indicator="next .htmx-indicator">
  <span class="htmx-indicator">⏳</span>
  <div class="search-results"></div>
</form>
