{% extends "base.html" %}
{% block title %}{{ sub.subroutine_name }} · ELM Explorer{% endblock %}
{% block body %}
<div class="page-head">
  <h2>{{ sub.module.module_name|default:'lib' }}::{{ sub.subroutine_name }}</h2>
  <div class="page-actions">
    <button data-toggle-all data-target="#left-panel" aria-pressed="false" class="styled-button">Expand all</button>
    <label class="check"><input type="checkbox" id="show-inactive" name="inactive" value="1" data-param="inactive" data-target="#left-panel"> show routines pruned by the config</label>
    <a class="styled-button" href="{% url 'calltree_view' %}?root={{ sub.sub_id }}">Tree graph</a>
  </div>
</div>
<div id="sub-split-view" class="split-container">
  <div class="left-panel" id="left-panel" data-reload-on-config
       hx-get="{% url 'calltree' sub.sub_id %}" hx-trigger="load, reload" hx-swap="innerHTML" hx-include="#show-inactive"></div>
  <div class="right-panel" id="right-panel" data-reload-on-config
       hx-get="{% url 'subroutine_details' sub.sub_id %}" hx-trigger="load, reload" hx-swap="innerHTML"></div>
</div>
{% endblock %}
